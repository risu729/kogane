# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of experiments/cloudflare-browser-run."
run = "./node_modules/.bin/wrangler types"

[tasks."typecheck"]
description = "Type-check experiments/cloudflare-browser-run."
depends = ["//experiments/cloudflare-browser-run:types"]
run = "./node_modules/.bin/tsc --noEmit"

[tasks."dry-run"]
description = "Validate the experiments/cloudflare-browser-run deployment without uploading it."
depends = ["//experiments/cloudflare-browser-run:types"]
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.bootstrap.jsonc",
]

[tasks."ci"]
description = "Every check CI runs for experiments/cloudflare-browser-run."
depends = ["//experiments/cloudflare-browser-run:typecheck"]
