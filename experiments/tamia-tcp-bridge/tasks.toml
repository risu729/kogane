# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["tamia-tcp-bridge:types"]
description = "Generate the Cloudflare Worker types of experiments/tamia-tcp-bridge."
dir = "experiments/tamia-tcp-bridge"
run = "./node_modules/.bin/wrangler types"

["tamia-tcp-bridge:typecheck"]
description = "Type-check experiments/tamia-tcp-bridge."
depends = ["tamia-tcp-bridge:types"]
dir = "experiments/tamia-tcp-bridge"
run = "./node_modules/.bin/tsc --noEmit"

["tamia-tcp-bridge:dry-run"]
description = "Validate the experiments/tamia-tcp-bridge deployment without uploading it."
depends = ["tamia-tcp-bridge:types"]
dir = "experiments/tamia-tcp-bridge"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.bootstrap.jsonc",
]

["ci:tamia-tcp-bridge"]
description = "Every check CI runs for experiments/tamia-tcp-bridge."
depends = ["tamia-tcp-bridge:typecheck"]
