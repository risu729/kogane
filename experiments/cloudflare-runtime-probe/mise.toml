# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of experiments/cloudflare-runtime-probe."
run = "./node_modules/.bin/wrangler types"

[tasks."typecheck"]
description = "Type-check experiments/cloudflare-runtime-probe."
depends = ["//experiments/cloudflare-runtime-probe:types"]
run = "./node_modules/.bin/tsc --noEmit"

[tasks."typecheck-container"]
description = "Type-check the container side of experiments/cloudflare-runtime-probe."
run = "./node_modules/.bin/tsc -p tsconfig.container.json --noEmit"

[tasks."dry-run"]
description = "Validate the experiments/cloudflare-runtime-probe deployment without uploading it."
depends = ["//experiments/cloudflare-runtime-probe:types"]
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

[tasks."ci"]
description = "Every check CI runs for experiments/cloudflare-runtime-probe."
depends = ["//experiments/cloudflare-runtime-probe:typecheck", "//experiments/cloudflare-runtime-probe:typecheck-container"]
