#:schema https://mise.jdx.dev/schema/mise.json

# mise 2026.9.3 is the first release whose `deps` providers this repository
# relies on (`mise deps --explain bun`, `mise deps --force`); the CI workflow
# pins the same version.
min_version = "2026.9.3"

[tools]
bun = "1.4.0"
node = "26.8.1"
hk = "1.57.0"
oxlint = "1.72.0"
oxfmt = "0.66.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
ghalint = "1.5.6"
pinact = "4.1.1"
zizmor = "1.29.0"
tombi = "1.5.1"
yamlfmt = "0.21.0"
uv = "0.12.10"
yamllint = "1.38.0"
typos = "1.50.1"
ruff = "0.16.6"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "windows-x64"]

[settings.npm]
package_manager = "bun"

[env]
# Root-level binaries. Bun's isolated linker keeps every workspace's own
# binaries in `<workspace>/node_modules/.bin`, which the tasks call by relative
# path from their `dir`; no task ever downloads a tool on demand.
_.path = ["{{config_root}}/node_modules/.bin"]

[deps.bun]
auto = true
sources = [
	"package.json",
	"bun.lock",
	"bunfig.toml",
	"apps/*/package.json",
	"experiments/*/package.json",
	"packages/*/package.json",
	"poc/*/package.json",
	"services/*/package.json",
]
outputs = ["node_modules/.bun"]
run = "bun install --frozen-lockfile"

[task_config]
includes = [
	"tasks.toml",
	"tasks",
	"packages/application/tasks.toml",
	"packages/collection/tasks.toml",
	"packages/domain/tasks.toml",
	"packages/evidence-contract/tasks.toml",
	"packages/identity/tasks.toml",
	"packages/observation-shared/tasks.toml",
	"packages/parsers/tasks.toml",
	"packages/read-model/tasks.toml",
	"poc/cloudflare-browser-run/tasks.toml",
	"poc/cloudflare-runtime-probe/tasks.toml",
	"poc/observation-pipeline/tasks.toml",
	"poc/oci-browser-probe/tasks.toml",
	"poc/sbi-vc-trade-client/tasks.toml",
	"poc/sbi-vc-trade-worker/tasks.toml",
	"poc/smbc-direct-backfill-worker/tasks.toml",
	"poc/sony-bank-worker/tasks.toml",
	"poc/tamia-tcp-bridge/tasks.toml",
	"poc/vpass-json/tasks.toml",
	"poc/vpoint-pay-worker/tasks.toml",
	"poc/vpoint-worker/tasks.toml",
	"services/collector-globalpass/tasks.toml",
	"services/collector-mobile-suica/tasks.toml",
	"services/collector-moneyforward/tasks.toml",
	"services/collector-myjcb/tasks.toml",
	"services/collector-r2-importer/tasks.toml",
	"services/collector-sbi-securities/tasks.toml",
	"services/collector-sbi-shinsei/tasks.toml",
	"services/evidence-browser/tasks.toml",
	"services/observation-pipeline/tasks.toml",
	"services/raw-evidence/tasks.toml",
]
