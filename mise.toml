#:schema https://mise.jdx.dev/schema/mise.json

# mise 2026.9.3 is the first release whose `deps` providers this repository
# relies on (`mise deps --explain bun`, `mise deps --force`); the CI workflow
# pins the same version.
min_version = "2026.9.3"
monorepo_root = true

[monorepo]
config_roots = ["apps/*", "experiments/*", "packages/*", "services/*"]
lockfile = true

[tools]
bun = "1.4.0"
node = "26.8.1"
hk = "1.57.0"
oxlint = "1.72.0"
oxfmt = "0.66.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
ghalint = "1.5.6"
pinact = "4.1.1"
zizmor = "1.29.0"
tombi = "1.5.1"
yamlfmt = "0.21.0"
uv = "0.12.10"
yamllint = "1.38.0"
typos = "1.50.1"
ruff = "0.16.6"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "windows-x64"]

[settings.npm]
package_manager = "bun"

[env]
# Root-level binaries. Bun's isolated linker keeps every workspace's own
# binaries in `<workspace>/node_modules/.bin`, which the tasks call by relative
# path from their `dir`; no task ever downloads a tool on demand.
_.path = ["{{config_root}}/node_modules/.bin"]

[deps.bun]
auto = true
sources = [
	"package.json",
	"bun.lock",
	"bunfig.toml",
	"apps/*/package.json",
	"experiments/*/package.json",
	"packages/*/package.json",
	"services/*/package.json",
]
outputs = ["node_modules/.bun"]
run = "bun install --frozen-lockfile"

[task_config]
includes = ["tasks", "tasks-compat.toml"]

# ref: https://mise.jdx.dev/tasks/

[tasks.install]
description = "Install the locked workspace dependencies."
run = "mise deps install"

[tasks.check]
description = "Run all repository checks without applying fixes."
run = "hk check --all --no-progress --no-fail-fast"

[tasks.fix]
description = "Apply the shared formatter and linter fixes."
run = "hk fix --all --no-progress --no-fail-fast"

[tasks."hooks:install"]
description = "Install the shared hk pre-commit hook using mise."
run = "hk install --mise"

[tasks."root:manifests"]
description = "Check that no manifest carries scripts and that every workspace has a CI task."
run = "bun tasks/_lib/check-manifests.ts"

[tasks."root:test"]
description = "Run the repository-wide guards that belong to no single workspace."
# Directories, not a list of files: a new guard next to the one it protects
# joins CI by existing, exactly like a new workspace does.
run = "bun test tasks/_lib scripts tests packages/collector-diagnostics/test/diagnostics.test.ts"

[tasks."root:depcruise"]
description = "Check the resolved import graph against the boundary rules."
# The text guard in tasks/_lib/import-boundaries.ts reads specifiers; this one
# walks what they resolve to, which is the only way to see a bare specifier, an
# exports map or an alias reaching an experiment (G4-07, G4-08). The runner
# also fails when the cruise saw too little to mean anything.
run = "bun tasks/_lib/depcruise.ts"

[tasks."root:knip"]
description = "Reject unresolved or unlisted imports, then report advisory unused-code findings."
# `--no-exit-code` is the point (unified plan 07 §6, acceptance G4-13): a
# runtime entry point knip cannot see — a cron, a Queue consumer, an Email
# route, a Durable Object — is the normal case in this repository, so its
# findings are read by a human against the resource ledger and never acted on
# automatically. `docs/unused-report.md` holds the committed summary.
run = ["./node_modules/.bin/knip --include unlisted,unresolved --no-config-hints", "./node_modules/.bin/knip --no-exit-code"]

[tasks."ci:root"]
description = "Every check CI runs for the repository-wide guards."
depends = ["root:manifests", "root:test", "root:depcruise", "root:knip"]

[tasks."ledger:resources"]
description = "Regenerate the deployed-resource ledger under infra/."
run = "bun scripts/resource-ledger.ts"

[tasks."ledger:schema"]
description = "Regenerate the CORE schema ledger under infra/."
run = "bun scripts/core-schema-ledger.ts"

[tasks."bootstrap:ingest-clients"]
description = "Render config/ingest-clients.json to the idempotent CORE bootstrap SQL under infra/bootstrap/."
run = "bun scripts/config-bootstrap.ts"

[tasks."ledger:deps"]
description = "Regenerate infra/dependency-resolution.md from the root bun.lock."
run = "bun scripts/dependency-ledger.ts"

[tasks."load-fixture"]
description = "Generate the synthetic load-harness fixture (scripts/load-fixture.ts)."
run = "bun scripts/load-fixture.ts"

[tasks."bundle"]
description = "Emit the deployable bundle of every Worker the release deploys."
# The release manifest digests these directories (unified plan 11 section 2):
# the deploy Action re-bundles, so identical bytes cannot be asserted against
# the live script; a recorded pre-deploy digest is what CD can prove.
depends = ["//services/...:bundle"]

[tasks."dry-run"]
description = "Validate every Worker deployment without uploading it."
depends = ["//services/...:dry-run", "//experiments/...:dry-run"]

[tasks.checks]
description = "Run repository and workspace checks, then deployment dry runs; called by hk."
depends = ["ci:root", "//apps/...:ci", "//experiments/...:ci", "//packages/...:ci", "//services/...:ci"]
depends_post = ["dry-run"]

[tasks.verify]
description = "Run the complete hk check suite."
depends = ["check"]
