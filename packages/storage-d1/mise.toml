# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."typecheck"]
description = "Type-check packages/storage-d1."
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
# Selected only by the hosted remainder; standalone and local full checks stay complete.
wait_for = ["//:ci:remainder:workspaces"]
description = "Run the packages/storage-d1 tests: codecs, atomic commands and the migration parity."
run = "node ../../tasks/_lib/coverage-run.mjs bun test"

[tasks."ci"]
description = "Every check CI runs for packages/storage-d1."
depends = ["//packages/storage-d1:typecheck", "//packages/storage-d1:test"]
