# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."typecheck"]
description = "Type-check packages/read-model."
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the packages/read-model tests."
run = "bun test"

[tasks."ci"]
description = "Every check CI runs for packages/read-model."
depends = ["//packages/read-model:typecheck", "//packages/read-model:test"]
