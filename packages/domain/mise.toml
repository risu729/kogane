# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."typecheck"]
description = "Type-check packages/domain."
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the packages/domain tests."
run = "bun test"

[tasks."ci"]
description = "Every check CI runs for packages/domain."
depends = ["//packages/domain:typecheck", "//packages/domain:test"]
