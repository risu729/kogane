# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["collector-diagnostics:typecheck"]
description = "Type-check packages/collector-diagnostics."
dir = "packages/collector-diagnostics"
run = "./node_modules/.bin/tsc --noEmit"

["collector-diagnostics:test"]
description = "Run the packages/collector-diagnostics tests."
dir = "packages/collector-diagnostics"
run = "bun test"

["ci:collector-diagnostics"]
description = "Every check CI runs for packages/collector-diagnostics."
depends = ["collector-diagnostics:typecheck", "collector-diagnostics:test"]
