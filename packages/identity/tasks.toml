# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["identity:typecheck"]
description = "Type-check packages/identity."
dir = "packages/identity"
run = "./node_modules/.bin/tsc --noEmit"

["identity:test"]
description = "Run the packages/identity tests."
dir = "packages/identity"
run = "bun test"

["ci:identity"]
description = "Every check CI runs for packages/identity."
depends = ["identity:typecheck", "identity:test"]
