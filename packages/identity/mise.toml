# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."typecheck"]
description = "Type-check packages/identity."
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the packages/identity tests."
run = "node ../../tasks/_lib/coverage-run.mjs bun test"

[tasks."ci"]
description = "Every check CI runs for packages/identity."
depends = ["//packages/identity:typecheck", "//packages/identity:test"]
