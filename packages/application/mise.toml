# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."typecheck"]
description = "Type-check packages/application."
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the packages/application tests."
run = "bun test"

[tasks."ci"]
description = "Every check CI runs for packages/application."
depends = ["//packages/application:typecheck", "//packages/application:test"]
