# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."typecheck"]
description = "Type-check packages/parsers."
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the packages/parsers tests."
run = "node ../../tasks/_lib/coverage-run.mjs bun test"

[tasks."digests"]
description = "Regenerate src/parsers/digests.ts from the deployed parser sources."
hide = true
# The generator writes plain JSON.stringify output; the committed file is in
# the repository's Oxfmt style, so format it here or every run rewrites it.
run = ["bun scripts/parser-digests.ts", "oxfmt src/parsers/digests.ts"]

[tasks."freeze-coverage-contract"]
description = "Re-freeze the coverage-contract fixture from the current parsers."
# A reviewed fixture update, never a routine step: the frozen file is what
# proves the converted parsers still emit the same observations.
hide = true
run = "bun scripts/freeze-coverage-contract.ts"

[tasks."ci"]
description = "Every check CI runs for packages/parsers."
depends = ["//packages/parsers:typecheck", "//packages/parsers:test"]
