# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["observation-shared:typecheck"]
description = "Type-check packages/observation-shared."
dir = "packages/observation-shared"
run = "./node_modules/.bin/tsc --noEmit"

["observation-shared:test"]
description = "Run the packages/observation-shared tests."
dir = "packages/observation-shared"
run = "bun test"

["ci:observation-shared"]
description = "Every check CI runs for packages/observation-shared."
depends = ["observation-shared:typecheck", "observation-shared:test"]
