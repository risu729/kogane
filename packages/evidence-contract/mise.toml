# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."typecheck"]
description = "Type-check packages/evidence-contract."
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the packages/evidence-contract tests."
run = "bun test"

[tasks."ci"]
description = "Every check CI runs for packages/evidence-contract."
depends = ["//packages/evidence-contract:typecheck", "//packages/evidence-contract:test"]
