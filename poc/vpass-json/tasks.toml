# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["vpass-json:types"]
description = "Generate the Cloudflare Worker types of poc/vpass-json."
dir = "poc/vpass-json"
run = "./node_modules/.bin/wrangler types"

["vpass-json:typecheck"]
description = "Type-check poc/vpass-json."
depends = ["vpass-json:types"]
dir = "poc/vpass-json"
run = "./node_modules/.bin/tsc --noEmit"

["vpass-json:test"]
description = "Run the poc/vpass-json tests."
depends = ["vpass-json:types"]
dir = "poc/vpass-json"
run = "bun test"

["vpass-json:dry-run"]
description = "Validate the poc/vpass-json deployment without uploading it."
depends = ["vpass-json:types"]
dir = "poc/vpass-json"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

["ci:vpass-json"]
description = "Every check CI runs for poc/vpass-json."
depends = ["vpass-json:typecheck", "vpass-json:test"]
