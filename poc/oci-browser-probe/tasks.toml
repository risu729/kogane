# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["oci-browser-probe:check"]
description = "Syntax-check the OCI browser probe; it is never executed in CI."
dir = "poc/oci-browser-probe"
run = "node --check probe.mjs"

["ci:oci-browser-probe"]
description = "Every check CI runs for poc/oci-browser-probe."
depends = ["oci-browser-probe:check"]
