# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["myjcb-worker:types"]
description = "Generate the Cloudflare Worker types of poc/myjcb-worker."
dir = "poc/myjcb-worker"
run = "./node_modules/.bin/wrangler types"

["myjcb-worker:typecheck"]
description = "Type-check poc/myjcb-worker."
depends = ["myjcb-worker:types"]
dir = "poc/myjcb-worker"
run = [
	"./node_modules/.bin/tsc --noEmit",
	"./node_modules/.bin/tsc --noEmit -p tsconfig.scripts.json",
]

["myjcb-worker:test"]
description = "Run the poc/myjcb-worker tests."
depends = ["myjcb-worker:types"]
dir = "poc/myjcb-worker"
run = "bun test"

["myjcb-worker:dry-run"]
description = "Validate the poc/myjcb-worker deployment without uploading it."
depends = ["myjcb-worker:types"]
dir = "poc/myjcb-worker"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

["ci:myjcb-worker"]
description = "Every check CI runs for poc/myjcb-worker."
depends = ["myjcb-worker:typecheck", "myjcb-worker:test"]
