[files]
# Generated ledgers (scripts/*-ledger.ts) carry hex digests; their prose lives in
# the generators, which are checked. See docs/infra-ledgers.md.
extend-exclude = [
	"data/**",
	"**/fixtures/**",
	"**/patches/**",
	"**/worker-configuration.d.ts",
	"**/*lock*",
	"infra/dependency-resolution.md",
	"infra/resources.json",
	"infra/resources.md",
	"infra/schema/core-ledger.json",
	"infra/schema/core-ledger.md",
]

[default.extend-words]
# Provider identifiers, product names, literal captures, and accepted spelling.
unparseable = "unparseable"
aas = "aas"
ba = "ba"
mis = "mis"
relese = "relese"
freee = "freee"
OT = "OT"
abck = "abck"
anser = "anser"
Secur = "Secur"
ede = "ede"
TPE = "TPE"
fo = "fo"
regist = "regist"
Metrix = "Metrix"
Infomation = "Infomation"
Ordr = "Ordr"
