name: Rollback
# Re-deploy an earlier commit that is still schema-compatible (unified plan
# 11 §7, acceptance G5-16). It is the same job as a release, in `rollback` mode:
# it applies no migration, restores no database and never turns a partial
# failure into a silent success. What a code rollback cannot undo — applied
# migrations, objects already written, decisions already recorded — stays, and
# docs/ci-cd.md says so per case.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The exact commit on main to go back to. It must be an ancestor of the recorded release.
        required: true
        type: string
      targets:
        description: Space- or comma-separated deploy-order names to roll back. Empty rolls back every Worker marked deploy in infra/deploy-order.json.
        required: false
        default: ""
        type: string
permissions: {}
jobs:
  rollback:
    name: Rollback
    concurrency:
      # The same group as deploy.yml, so a rollback and a release can never run
      # against Cloudflare at the same time.
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read # for checkout
      deployments: write # the release ledger
    uses: ./.github/workflows/_deploy-workers.yml # zizmor: ignore[secrets-inherit]
    # The Cloudflare credentials live in the `production` Environment and are
    # read by the called workflow's job, which is where `environment:
    # production` is declared. GitHub resolves `secrets.*` inside a called
    # workflow from what the caller passed, and a caller that invokes a
    # reusable workflow cannot declare an environment of its own, so an
    # environment secret is reachable only through `secrets: inherit`. Without
    # it every `secrets.*` in the called workflow is the empty string and
    # nothing says so: that is how release 34635388395 reached `wrangler d1
    # migrations apply` with no token and no account id
    # (docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows,
    # "Environment secrets cannot be passed from the caller workflow";
    # actions/runner#4453). The called workflow lives in this repository and is
    # read from the default branch; it references exactly one secret, and a
    # test asserts which of its steps may read it (G5-17). Its preflight step
    # fails the run before anything is applied if the token or the account id
    # is still empty. The exclusion of ghalint's `deny_inherit_secrets` for
    # this job is recorded in `ghalint.yaml`.
    secrets: inherit
    with:
      sha: ${{ inputs.sha }}
      targets: ${{ inputs.targets }}
      mode: rollback
