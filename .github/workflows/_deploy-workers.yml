name: Deploy Workers
# The one job that uploads Workers to Cloudflare. `deploy.yml` calls it after a
# successful CI run on main; `rollback.yml` calls it with an earlier commit
# (unified plan 11). Both callers hold the same `production-deploy` concurrency
# group, so a release and a rollback can never overlap, and the group is held by
# the calling job for the whole of this workflow.
#
# `environment: production` lives here rather than on the calling job because a
# job that calls a reusable workflow cannot declare an environment. That is also
# why both callers pass `secrets: inherit`: an environment secret is not
# reachable from a called workflow any other way. The Cloudflare credentials are
# read by the preflight, migration and deploy steps only (unified plan 12 §5,
# acceptance G5-17); no bank secret is ever synchronised from CD, and the
# Action's `secrets-json` input is not used anywhere in this repository.
#
# What this job deploys is decided per Worker, never by an input: a release
# always covers every Worker the deployment ledger marks `deploy`, and the
# release record says which commit each one is at, so a run that resumes after a
# partial or failed release deploys exactly what the ledger cannot account for
# (finding 2). Only `rollback.yml` narrows the set, through `targets`.
on:
  workflow_call:
    inputs:
      sha:
        description: The exact commit to release. Must be a full 40-character sha.
        required: true
        type: string
      targets:
        description: "Rollback only: space- or comma-separated deploy-order names to roll back. Empty means every Worker marked deploy in infra/deploy-order.json. A release refuses a non-empty value; it always deploys the whole set."
        required: false
        default: ""
        type: string
      mode:
        description: release (forward, applies migrations) or rollback (backward, refuses unless the schema is compatible and never applies or restores anything).
        required: false
        default: release
        type: string
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  release:
    name: Release
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # for checkout
      deployments: write # the release ledger (unified plan 11 §3)
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the requested commit and mode
        env:
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          TARGETS: ${{ inputs.targets }}
        run: |
          if [[ ! ${SHA} =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release target must be a full commit sha, not '${SHA}'." >&2
            exit 1
          fi
          if [[ ${MODE} != release && ${MODE} != rollback ]]; then
            echo "Unknown mode '${MODE}'." >&2
            exit 1
          fi
          # A release is never partial. A partial release used to record the
          # whole commit as live, so the next full release of the same commit
          # was skipped as "nothing to do" and the Workers it had not deployed
          # stayed behind (finding 2). Deploying one Worker on purpose is a
          # rollback, which records per target.
          if [[ ${MODE} == release && -n ${TARGETS//[[:space:],]/} ]]; then
            echo "A release deploys every Worker marked deploy in infra/deploy-order.json; 'targets' is for rollback.yml." >&2
            exit 1
          fi
      - name: Confirm the commit is on the release branch
        # Before anything from that commit is checked out, let alone run: a
        # manual dispatch must not be able to put a branch, fork or pull request
        # commit into production (unified plan 11 §2), and a pull request's head
        # commit *is* fetchable from this repository. The compare API answers
        # `identical` for the branch tip and `behind` once the branch has moved
        # past the commit; `ahead` and `diverged` mean it is not on the branch.
        # `gh` is the runner's own; an API error fails the step, never passes it.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BRANCH}...${SHA}" --jq '.status')
          case "${status}" in
            identical | behind)
              echo "${SHA} is on ${BRANCH} (${status})." | tee -a "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "${SHA} is '${status}' relative to ${BRANCH}; only commits on ${BRANCH} are released." >&2
              exit 1
              ;;
          esac
      - name: Checkout the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI passed on, never a branch tip: a branch moves between
          # the CI run and this one (unified plan 11 §2).
          ref: ${{ inputs.sha }}
          # The ledger interlock answers with `git merge-base --is-ancestor`,
          # which needs both commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the checkout is that commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [[ ${head} != "${SHA}" ]]; then
            echo "Checked out ${head}, expected ${SHA}." >&2
            exit 1
          fi
      - name: Install node
        # The checkout is a commit on the release branch, confirmed above, so
        # its mise configuration and the scripts below are reviewed code.
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.3
          # No tool cache anywhere in this job: its cache scope is shared with
          # pull request CI, which runs pull request code, so a restored archive
          # is not a trusted source of the interpreter that decides whether this
          # release may proceed.
          cache: false
        env:
          # The ledger steps below run before the rest of the toolchain exists;
          # they need the pinned node, not whatever the runner image ships.
          MISE_ENABLE_TOOLS: node
      - name: Read the release ledger
        id: ledger
        # The newest *successful* deployment is the environment's state. A newer
        # deployment that failed or was cancelled is not — but it ran, so its
        # record (the plan it was working from) is read too and printed: it says
        # which migrations and which Workers it may have got to before it
        # stopped, which is what makes the resume below readable (finding 2).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/release-ledger.mjs latest \
            --record "${RUNNER_TEMP}/previous-record.json" \
            --attempt "${RUNNER_TEMP}/attempt-record.json"
      - name: Decide whether this run may deploy
        id: decide
        # Per Worker, against the recorded release: the ones that are behind are
        # deployed, the ones already at this commit or at a newer one are left
        # alone, and only a run with nothing left to do ends here successfully
        # (acceptance G5-12). A diverged history fails loudly. The decision is
        # written to a plan file, which is the single answer the manifest, the
        # deploy steps and the record all read (finding 2).
        env:
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          RECORDED: ${{ steps.ledger.outputs.sha }}
          TARGETS: ${{ inputs.targets }}
        run: |
          node .github/scripts/release-ledger.mjs decide \
            --mode "${MODE}" --head "${SHA}" --recorded "${RECORDED}" \
            --targets "${TARGETS}" \
            --previous "${RUNNER_TEMP}/previous-record.json" \
            --plan "${RUNNER_TEMP}/release-plan.json"
      - name: Install the rest of the toolchain
        if: steps.decide.outputs.proceed == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.3
          cache: false
      - name: Install the locked dependencies
        if: steps.decide.outputs.proceed == 'true'
        run: mise run install
      - name: Build every deployable bundle
        if: steps.decide.outputs.proceed == 'true'
        run: mise run bundle
      - name: Validate every Worker without uploading
        # No Cloudflare account or token is in scope for this step, so the
        # whole build and validation happens before any credential is used
        # (acceptance G5-09, G4-16).
        if: steps.decide.outputs.proceed == 'true'
        run: mise run dry-run
      - name: Confirm the production credentials reached this job
        # The first step in which a credential exists, and it uses neither: it
        # only asserts that both are non-empty, and prints no value. Everything
        # this commit builds and validates has already run (G5-09, G4-16).
        #
        # This is not paranoia about a forgotten setting. This job runs from a
        # reusable workflow, and GitHub resolves `secrets.*` in a called
        # workflow from what the caller passed; an environment secret needs
        # `secrets: inherit` on the caller, and a secret that was not passed is
        # an empty string rather than an error. Release 34635388395 therefore
        # got as far as opening a deployment record and calling `wrangler d1
        # migrations apply` before failing on "In a non-interactive
        # environment, it's necessary to set a CLOUDFLARE_API_TOKEN
        # environment variable", with nothing applied and nothing explaining
        # why. Failing here costs one step and says what to create.
        if: steps.decide.outputs.proceed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=()
          if [[ -z ${CLOUDFLARE_API_TOKEN} ]]; then
            missing+=("the production environment secret CLOUDFLARE_API_TOKEN")
          fi
          if [[ -z ${CLOUDFLARE_ACCOUNT_ID} ]]; then
            missing+=("the production environment (or repository) variable CLOUDFLARE_ACCOUNT_ID")
          fi
          if ((${#missing[@]} > 0)); then
            for entry in "${missing[@]}"; do
              echo "This job cannot reach ${entry}; it resolved to an empty string." >&2
            done
            {
              echo "Create them under Settings -> Environments -> production, exactly as"
              echo "docs/ci-cd.md ('Required GitHub and Cloudflare settings') describes, and"
              echo "check that both callers of this workflow still pass 'secrets: inherit' —"
              echo "without it an environment secret is empty inside a called workflow."
              echo "Nothing has been applied or uploaded by this run."
            } >&2
            exit 1
          fi
          echo "The production Cloudflare credentials are in scope." | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Stamp the release sha into the deployed configurations
        # A deployed Worker can only answer "which commit are you" if the sha is
        # in its configuration, and the pinned deploy Action has no input for a
        # variable. This writes it into the runner's checkout *before* the
        # manifest is computed, so the manifest records exactly the
        # configuration that is uploaded and the re-verification below still
        # holds (unified plan 11 §6, docs/ci-cd.md § Postcheck).
        if: steps.decide.outputs.proceed == 'true'
        env:
          SHA: ${{ inputs.sha }}
        run: node .github/scripts/release-sha.mjs --sha "${SHA}"
      - name: Compute the release manifest
        if: steps.decide.outputs.proceed == 'true'
        env:
          SHA: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/release-manifest.mjs write \
            --sha "${SHA}" \
            --mode "${MODE}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-url "${RUN_URL}" \
            --plan "${RUNNER_TEMP}/release-plan.json" \
            --out "${RUNNER_TEMP}/release-manifest.json" \
            --record "${RUNNER_TEMP}/release-record.json"
      - name: Upload the release manifest
        if: steps.decide.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
      - name: Compare the schema with the recorded release
        id: schema
        # Also settles what the release record says the database holds: a
        # release applies this commit's migrations, a rollback applies none and
        # leaves the deployed list as it is.
        if: steps.decide.outputs.proceed == 'true'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          node .github/scripts/release-manifest.mjs compare \
            --mode "${MODE}" \
            --previous "${RUNNER_TEMP}/previous-record.json" \
            --current "${RUNNER_TEMP}/release-record.json"
      - name: Refuse an incompatible rollback
        # Migrations are additive and are never reverted, so a rollback target
        # may know fewer migrations than the database has, but never different
        # ones. CORE is not restored from a backup by any workflow
        # (unified plan 11 §7, acceptance G5-16).
        if: steps.decide.outputs.proceed == 'true' && inputs.mode == 'rollback'
        env:
          PREFIX: ${{ steps.schema.outputs.core-prefix }}
        run: |
          if [[ ${PREFIX} != true ]]; then
            echo "The rollback target's CORE migration list is not a prefix of the deployed one; refusing." >&2
            exit 1
          fi
      - name: Select the Workers this run deploys
        id: select
        # Nothing is decided here: the set is the plan the decision wrote, so
        # the step conditions below, the release record and the postcheck all
        # follow one answer. This step only publishes it, with the two schema
        # targets the migration steps need.
        if: steps.decide.outputs.proceed == 'true'
        run: |
          order=infra/deploy-order.json
          plan="${RUNNER_TEMP}/release-plan.json"
          printf 'Deploying: %s\n' "$(jq -r '.selected | join(" ")' "${plan}")" | tee -a "${GITHUB_STEP_SUMMARY}"
          printf 'Left at the commit the ledger records: %s\n' "$(jq -r '[.kept[] | "\(.name)@\(.sha[0:12])"] | join(" ")' "${plan}")" | tee -a "${GITHUB_STEP_SUMMARY}"
          {
            printf 'selected=%s\n' "$(jq -c '.selected' "${plan}")"
            printf 'core-config=%s\n' "$(jq -r '.schema.core | "\(.path)/\(.config)"' "${order}")"
            printf 'core-database=%s\n' "$(jq -r '.schema.core.database' "${order}")"
            printf 'read-config=%s\n' "$(jq -r 'if .schema.read == null then "" else "\(.schema.read.path)/\(.schema.read.config)" end' "${order}")"
            printf 'read-database=%s\n' "$(jq -r '.schema.read.database // ""' "${order}")"
          } >> "${GITHUB_OUTPUT}"
      - name: Open the deployment record
        id: deployment
        if: steps.decide.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESCRIPTION: kogane ${{ inputs.mode }} ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/release-ledger.mjs create \
            --record "${RUNNER_TEMP}/release-record.json" \
            --description "${DESCRIPTION}" \
            --log-url "${RUN_URL}"
      - name: Apply the CORE migrations
        id: migrate-core
        # Runs only forward, only when this commit knows a migration the
        # recorded release did not, and inside the non-cancellable concurrency
        # group of the calling job, so a later push cannot interrupt it
        # (acceptance G5-13). Wrangler reads `migrations_dir` from the same
        # configuration, so moving the directory needs no workflow change.
        if: steps.decide.outputs.proceed == 'true' && inputs.mode == 'release' && steps.schema.outputs.core-apply == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE: ${{ steps.select.outputs.core-database }}
          CONFIG: ${{ steps.select.outputs.core-config }}
        run: |
          # `migrations list` names the migrations the remote database has not
          # applied yet, so the pair around the apply is the release log's
          # answer to "what did this run change": everything the first listing
          # names and the second one does not. It reads the same
          # `migrations_dir` as the apply, and answers "No migrations to
          # apply!" rather than failing when the list is empty.
          echo "CORE migrations not yet applied, before:" | tee -a "${GITHUB_STEP_SUMMARY}"
          ./node_modules/.bin/wrangler d1 migrations list "${DATABASE}" --remote --config "${CONFIG}" | tee -a "${GITHUB_STEP_SUMMARY}"
          ./node_modules/.bin/wrangler d1 migrations apply "${DATABASE}" --remote --config "${CONFIG}"
          echo "CORE migrations not yet applied, after (none is expected):" | tee -a "${GITHUB_STEP_SUMMARY}"
          ./node_modules/.bin/wrangler d1 migrations list "${DATABASE}" --remote --config "${CONFIG}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Apply the READ migrations
        id: migrate-read
        # Skipped while no READ database is declared in infra/deploy-order.json.
        if: steps.decide.outputs.proceed == 'true' && inputs.mode == 'release' && steps.schema.outputs.read-apply == 'true' && steps.select.outputs.read-config != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE: ${{ steps.select.outputs.read-database }}
          CONFIG: ${{ steps.select.outputs.read-config }}
        run: |
          echo "READ migrations not yet applied, before:" | tee -a "${GITHUB_STEP_SUMMARY}"
          ./node_modules/.bin/wrangler d1 migrations list "${DATABASE}" --remote --config "${CONFIG}" | tee -a "${GITHUB_STEP_SUMMARY}"
          ./node_modules/.bin/wrangler d1 migrations apply "${DATABASE}" --remote --config "${CONFIG}"
          echo "READ migrations not yet applied, after (none is expected):" | tee -a "${GITHUB_STEP_SUMMARY}"
          ./node_modules/.bin/wrangler d1 migrations list "${DATABASE}" --remote --config "${CONFIG}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Re-verify the release manifest
        # The last check before a credential reaches Wrangler: every digest the
        # manifest recorded is recomputed from the working tree, so a bundle,
        # configuration, lockfile or migration that changed after the manifest
        # was written stops the deployment (acceptance G5-11).
        if: steps.decide.outputs.proceed == 'true'
        run: node .github/scripts/release-manifest.mjs verify --manifest "${RUNNER_TEMP}/release-manifest.json"
      - name: Deploy the Processor
        id: deploy-processor
        # `deploy-<ledger name>`: `release-ledger.mjs progress` reads this id
        # from the job's `steps` context to record, per Worker, what happened.
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'processor')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/processor
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the App
        id: deploy-app
        # `deploy-<ledger name>`: `release-ledger.mjs progress` reads this id
        # from the job's `steps` context to record, per Worker, what happened.
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'app')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/app
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The collectors, in the ledger's order, after every consumer of the
      # shared contract (unified plan 11 §4). Uploading a collector replaces
      # its script and nothing else: its crons stay as its configuration
      # declares them, no Durable Object alarm is set at startup and no
      # `scheduled` event is triggered by a deploy, so a release never starts a
      # collection, a re-authentication or a backfill (docs/ci-cd.md, G5-14).
      # Two of them build a container image, so the runner needs Docker — the
      # same requirement `mise run dry-run` already has. Native branch rules
      # govern reviews of collector changes; the upload itself is automatic.
      - name: Deploy the GlobalPass collector
        id: deploy-globalpass-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'globalpass-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-globalpass
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the Mobile Suica collector
        id: deploy-mobile-suica-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'mobile-suica-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-mobile-suica
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the Money Forward collector
        id: deploy-moneyforward-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'moneyforward-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-moneyforward
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the MyJCB collector
        id: deploy-myjcb-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'myjcb-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-myjcb
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the SBI Securities collector
        id: deploy-sbi-securities-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'sbi-securities-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-sbi-securities
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the SBI Shinsei collector
        id: deploy-sbi-shinsei-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'sbi-shinsei-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-sbi-shinsei
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the SBI VC Trade collector
        id: deploy-sbi-vc-trade-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'sbi-vc-trade-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-sbi-vc-trade
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the SMBC Direct collector
        id: deploy-smbc-direct-backfill-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'smbc-direct-backfill-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-smbc-direct
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the Sony Bank collector
        id: deploy-sony-bank-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'sony-bank-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-sony-bank
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the Vpass collector
        id: deploy-vpass-json
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'vpass-json')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-vpass
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the V Point Pay collector
        id: deploy-vpoint-pay-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'vpoint-pay-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-vpoint-pay
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the V Point collector
        id: deploy-vpoint-worker
        if: steps.decide.outputs.proceed == 'true' && contains(fromJson(steps.select.outputs.selected), 'vpoint-worker')
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: production
          working-directory: services/collector-vpoint
          config: wrangler.jsonc
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Postcheck the public health routes
        # The Workers this run deployed whose health route needs no
        # authentication: every collector with a
        # `/health`. 200 is not enough on its own — the answer must carry the
        # identity field the ledger names, so an edge error page or an empty
        # body is a failure rather than a pass (unified plan 11 §6,
        # docs/ci-cd.md § Postcheck).
        if: steps.decide.outputs.proceed == 'true'
        env:
          SELECTED: ${{ steps.select.outputs.selected }}
        run: |
          order=infra/deploy-order.json
          subdomain=$(jq -r '.workersDevSubdomain' "${order}")
          status=0
          while IFS=$'\t' read -r name worker path field; do
            if ! jq -e --arg name "${name}" 'index($name)' <<<"${SELECTED}" > /dev/null; then continue; fi
            url="https://${worker}.${subdomain}${path}"
            body="${RUNNER_TEMP}/health-${name}.json"
            code=$(curl --silent --show-error --location --max-time 20 \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --output "${body}" --write-out '%{http_code}' "${url}" || echo 000)
            if [[ ${code} != 200 ]]; then
              echo "${worker}${path}: ${code}" | tee -a "${GITHUB_STEP_SUMMARY}"
              status=1
              continue
            fi
            value=$(jq -r --arg field "${field}" '
              if type == "object" and (.[$field] != null) and (.[$field] != "")
              then (.[$field] | tostring) else "" end' "${body}" 2> /dev/null || echo "")
            if [[ -z ${value} ]]; then
              echo "${worker}${path}: 200 without ${field}" | tee -a "${GITHUB_STEP_SUMMARY}"
              status=1
              continue
            fi
            echo "${worker}${path}: 200 (${field}=${value})" | tee -a "${GITHUB_STEP_SUMMARY}"
          done < <(jq -r '.workers[] | select(.deploy and .healthPath != "" and .healthAuth == "none") | [.name, .worker, .healthPath, .healthIdentity] | @tsv' "${order}")
          exit "${status}"
      - name: Postcheck the App and the Processor
        # The authenticated half (unified plan 11 §6). The App authenticates
        # every request through Cloudflare Access and the Processor is published
        # on no hostname, so this is the only way a release can see that the
        # pair it just uploaded is the pair that is running: CD calls the App's
        # `/api/ops/v1/health` with an Access *service token* and asserts the
        # build identity, the applied CORE migration the manifest expected, READ
        # when the deployment reads it, and the Processor's own release — which
        # the App relays over its service binding.
        #
        # Without the service token the release fails here rather than passing
        # on an unchecked App: the token and its Access policy are one-time
        # owner setup (docs/rollout.md §6.6).
        if: steps.decide.outputs.proceed == 'true'
        env:
          SELECTED: ${{ steps.select.outputs.selected }}
          SHA: ${{ inputs.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          order=infra/deploy-order.json
          mapfile -t rows < <(jq -r '.workers[] | select(.deploy and .healthAuth == "access") | [.name, .worker, .healthPath, .healthIdentity] | @tsv' "${order}")
          if [[ ${#rows[@]} -ne 1 ]]; then
            echo "Expected exactly one authenticated health route in ${order}, found ${#rows[@]}." >&2
            exit 1
          fi
          IFS=$'\t' read -r name worker path _field <<<"${rows[0]}"
          if ! jq -e --arg name "${name}" 'index($name)' <<<"${SELECTED}" > /dev/null; then
            echo "${name} was not deployed by this run; nothing to postcheck." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ -z ${CF_ACCESS_CLIENT_ID} || -z ${CF_ACCESS_CLIENT_SECRET} ]]; then
            echo "The production Environment holds no CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET, so the App's health route cannot be read; see docs/rollout.md section 6.6." >&2
            exit 1
          fi
          subdomain=$(jq -r '.workersDevSubdomain' "${order}")
          body="${RUNNER_TEMP}/health-${name}.json"
          # No --location: an unauthenticated request is redirected to the
          # Access login screen, and following that would turn a rejected
          # request into a 200 with an HTML body.
          code=$(curl --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            --output "${body}" --write-out '%{http_code}' \
            "https://${worker}.${subdomain}${path}" || echo 000)
          if [[ ${code} != 200 ]]; then
            echo "${worker}${path}: ${code}" | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if ! jq -e 'type == "object"' "${body}" > /dev/null 2>&1; then
            echo "${worker}${path}: 200 without a JSON object body (an edge or login page is not the App)." | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
          expected=$(jq -r '.migrations.core.files[-1].file // ""' "${RUNNER_TEMP}/release-manifest.json")
          reasons=$(jq -r --arg sha "${SHA}" --arg migration "${expected}" '
            [ if .status != "ok" then "status=\(.status // "absent")" else empty end,
              if .releaseSha != $sha then "releaseSha=\(.releaseSha // "absent")" else empty end,
              if ($migration != "") and (((.core.migrationsApplied // []) | index($migration)) == null)
                then "CORE is missing \($migration)" else empty end,
              if (.read.required == true) and (.read.ok != true) then "READ is required and not ok" else empty end,
              if .processor.releaseSha != $sha then "processor.releaseSha=\(.processor.releaseSha // "absent")" else empty end
            ] | .[]' "${body}")
          if [[ -n ${reasons} ]]; then
            {
              echo "${worker}${path}: 200 but the release is not healthy:"
              echo "${reasons}"
            } | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
          {
            echo "${worker}${path}: 200 (release ${SHA}, CORE through ${expected})"
            jq -r '"processor: \(.processor.releaseSha // "absent"), read required=\(.read.required), marker=\(.data.markerPresent)"' "${body}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Record what this run deployed
        id: progress
        # The deployment payload was fixed when the deployment was opened, so it
        # is the plan; this is what actually happened. `always()`, because the
        # run that most needs an account of itself is the one that failed half
        # way: the `steps` context says per Worker whether its upload ran, was
        # skipped, failed, or was never reached, and the same for the two
        # migration steps (finding 2). The next run reads the summary from the
        # deployment status and this file from the run's artifacts.
        if: ${{ always() && steps.decide.outputs.proceed == 'true' }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          node .github/scripts/release-ledger.mjs progress \
            --record "${RUNNER_TEMP}/release-record.json" \
            --out "${RUNNER_TEMP}/release-progress.json"
      - name: Upload the release progress
        if: ${{ always() && steps.decide.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-progress-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-progress.json
          # A run that failed before the record was written has nothing to
          # upload, and that must not become a second failure.
          if-no-files-found: warn
      - name: Record the release as successful
        if: ${{ success() && steps.deployment.outputs.deployment-id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment-id }}
          DESCRIPTION: kogane ${{ inputs.mode }} ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/release-ledger.mjs status \
            --deployment "${DEPLOYMENT_ID}" --state success \
            --description "${DESCRIPTION}" --log-url "${RUN_URL}" \
            --progress "${RUNNER_TEMP}/release-progress.json"
      - name: Record the release as failed
        # Nothing is rolled back automatically: a failed release leaves the
        # Workers that already uploaded in place and the database as it is
        # (unified plan 11 §7, acceptance G5-16). Recovery is a decision — and
        # re-running this workflow for the same commit is one of the available
        # ones, because the next run reads this deployment's record as "may
        # have been applied" and deploys what the ledger cannot account for
        # rather than skipping the commit (finding 2).
        if: ${{ failure() && steps.deployment.outputs.deployment-id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment-id }}
          DESCRIPTION: kogane ${{ inputs.mode }} ${{ inputs.sha }} failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          node .github/scripts/release-ledger.mjs status \
            --deployment "${DEPLOYMENT_ID}" --state failure \
            --description "${DESCRIPTION}" --log-url "${RUN_URL}" \
            --progress "${RUNNER_TEMP}/release-progress.json"
