name: CI
# No path filters: CI Check is a required status check, and a workflow skipped
# by a path filter leaves it pending forever instead of reporting success.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
concurrency:
  group: ci-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.ref) }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
  KOGANE_TEST_COVERAGE: "true"
  COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  # Public ubuntu-24.04 runners have four CPUs; avoid eight native tasks competing.
  MISE_JOBS: "4"
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.6
      - name: Verify bounded large-artifact restore
        timeout-minutes: 2
        run: mise exec -- node tasks/_lib/ci/release-resume.mjs resource-check
      - name: Run repository checks and linters
        # All lint steps plus the guarded native remainder. The two processor
        # shards on separate runners complete the same local hk check graph.
        run: |
          lint_result=0
          mise exec -- hk check --all --skip-step repository --no-fail-fast || lint_result=$?
          graph_result=0
          mise run --continue-on-error ci:remainder || graph_result=$?
          test "${lint_result}" -eq 0 && test "${graph_result}" -eq 0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: "false"
      - name: Validate and summarize native coverage
        if: ${{ always() }}
        run: mise exec --no-deps -- node tasks/_lib/coverage-summary.mjs checks
      - name: Upload native coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-checks-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            coverage/
            apps/*/coverage/
            experiments/*/coverage/
            packages/*/coverage/
            services/*/coverage/
          if-no-files-found: error
          retention-days: 14
  processor:
    name: Processor (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # for checkout
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.6
      - name: Run the complete native processor shard
        run: mise run --continue-on-error "//services/processor:test-shard-${SHARD}"
        env:
          SHARD: ${{ matrix.shard }}
          WRANGLER_SEND_METRICS: "false"
      - name: Validate and summarize native coverage
        if: ${{ always() }}
        run: mise exec --no-deps -- node tasks/_lib/coverage-summary.mjs "processor-${SHARD}"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload native coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-processor-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            coverage/
            apps/*/coverage/
            experiments/*/coverage/
            packages/*/coverage/
            services/*/coverage/
          if-no-files-found: error
          retention-days: 14
  ci-check:
    name: CI Check
    needs:
      - checks
      - processor
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every check to have succeeded
        # Failure, cancellation and an unexpected skip must all fail the
        # existing required status. This remains separate from the checks job.
        run: test "${CHECKS_RESULT}" = success && test "${PROCESSOR_RESULT}" = success
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PROCESSOR_RESULT: ${{ needs.processor.result }}
  actions-timeline:
    name: Generate Actions Timeline
    needs:
      - ci-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Required by actions-timeline to read this workflow run's jobs.
    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
