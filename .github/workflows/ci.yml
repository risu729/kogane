name: CI
# No path filters: CI Check is a required status check, and a workflow skipped
# by a path filter leaves it pending forever instead of reporting success.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
    inputs:
      container-verification:
        description: Run the separately approved synthetic Container verification
        type: boolean
        required: false
        default: false
concurrency:
  group: ci-${{ case(github.event_name == 'workflow_dispatch' && inputs.container-verification, github.run_id, github.event_name == 'pull_request', github.event.pull_request.number, github.ref) }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
  # Public ubuntu-24.04 runners have four CPUs; avoid eight native tasks competing.
  MISE_JOBS: "4"
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.5
      - name: Run repository checks and linters
        # All lint steps plus the guarded native remainder. The two processor
        # shards on separate runners complete the same local hk check graph.
        run: |
          lint_result=0
          mise exec -- hk check --all --skip-step repository --no-fail-fast || lint_result=$?
          graph_result=0
          mise run --continue-on-error ci:remainder || graph_result=$?
          test "${lint_result}" -eq 0 && test "${graph_result}" -eq 0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: "false"
  processor:
    name: Processor (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # for checkout
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.5
      - name: Run the complete native processor shard
        run: mise run --continue-on-error "//services/processor:test-shard-${SHARD}"
        env:
          SHARD: ${{ matrix.shard }}
          WRANGLER_SEND_METRICS: "false"
  ci-check:
    name: CI Check
    needs:
      - checks
      - processor
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every check to have succeeded
        # Failure, cancellation and an unexpected skip must all fail the
        # existing required status. This remains separate from the checks job.
        run: test "${CHECKS_RESULT}" = success && test "${PROCESSOR_RESULT}" = success
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PROCESSOR_RESULT: ${{ needs.processor.result }}
  actions-timeline:
    name: Generate Actions Timeline
    needs:
      - ci-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Required by actions-timeline to read this workflow run's jobs.
    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
  container-verification:
    name: Synthetic Container verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.container-verification }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: container-api-verification
    concurrency:
      group: container-api-verification
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout the selected reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.5
      - name: Install pinned verification dependencies
        timeout-minutes: 5
        run: mise exec -- bun install --frozen-lockfile
      - name: Verify the synthetic runtime and exact SDK rollback
        timeout-minutes: 32
        run: |
          private_temp="$(mktemp -d "${RUNNER_TEMP}/container-api-verification.XXXXXXXX")"
          chmod 700 "${private_temp}"
          printf 'CONTAINER_VERIFICATION_TEMP=%s\n' "${private_temp}" >> "${GITHUB_ENV}"
          export CONTAINER_VERIFICATION_TEMP="${private_temp}"
          mise exec -- node experiments/container-api-verification/run-hosted.mjs
        env:
          # These names have no production-secret fallback. Environment approval
          # and exact temporary Worker/token scope are prerequisites.
          CONTAINER_VERIFICATION_API_TOKEN: ${{ secrets.CONTAINER_VERIFICATION_API_TOKEN }}
          CONTAINER_VERIFICATION_ACCOUNT_ID: ${{ vars.CONTAINER_VERIFICATION_ACCOUNT_ID }}
          CONTAINER_VERIFICATION_SUBDOMAIN: ${{ vars.CONTAINER_VERIFICATION_SUBDOMAIN }}
      - name: Confirm cleanup of owned temporary resources
        if: ${{ always() }}
        timeout-minutes: 8
        run: mise exec -- node experiments/container-api-verification/run-hosted.mjs cleanup
        env:
          CONTAINER_VERIFICATION_API_TOKEN: ${{ secrets.CONTAINER_VERIFICATION_API_TOKEN }}
          CONTAINER_VERIFICATION_ACCOUNT_ID: ${{ vars.CONTAINER_VERIFICATION_ACCOUNT_ID }}
          CONTAINER_VERIFICATION_SUBDOMAIN: ${{ vars.CONTAINER_VERIFICATION_SUBDOMAIN }}
