name: CI
# No path filters: CI Check is a required status check, and a workflow skipped
# by a path filter leaves it pending forever instead of reporting success.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
concurrency:
  group: ci-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.ref) }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.3
      - name: Run every check
        # hk owns lint and the mise verification graph, including all workspace
        # tests, builds and Worker dry runs. Local verification is the same command.
        run: mise exec -- hk check --all --no-fail-fast
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: "false"
  ci-check:
    name: CI Check
    needs:
      - checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every check to have succeeded
        # Failure, cancellation and an unexpected skip must all fail the
        # existing required status. This remains separate from the checks job.
        run: test "${CHECKS_RESULT}" = success
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
  actions-timeline:
    name: Generate Actions Timeline
    needs:
      - ci-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Required by actions-timeline to read this workflow run's jobs.
    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
