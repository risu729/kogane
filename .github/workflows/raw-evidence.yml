name: Raw evidence

on:
  pull_request:
    paths:
      - "services/raw-evidence/**"
      - "docs/raw-store.md"
      - "docs/roadmap.md"
      - ".github/workflows/raw-evidence.yml"
  push:
    branches: [main]
    paths:
      - "services/raw-evidence/**"
      - "docs/raw-store.md"
      - "docs/roadmap.md"
      - ".github/workflows/raw-evidence.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/raw-evidence
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:importer
      - run: bun run test
      - run: bun run cf:check
