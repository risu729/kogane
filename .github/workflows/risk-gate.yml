name: Risk Gate
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
concurrency:
  group: risk-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  risk-gate:
    # This name is the status check context the branch ruleset must require.
    name: Risk Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Checkout of the base ref and the compare API.
      pull-requests: read # Reading the review list.
    steps:
      - name: Checkout the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit, not the merge commit: the gate classifies the pull
          # request through the API and must not execute its code.
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/scripts
            infra
            mise.toml
            mise.lock
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
        env:
          MISE_ENABLE_TOOLS: node
      - name: Classify the change and check the owner approval
        run: node .github/scripts/risk-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY_OWNER: ${{ github.event.repository.owner.login }}
