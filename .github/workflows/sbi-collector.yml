name: Collect SBI Securities snapshots

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbi-securities-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect domestic and foreign snapshots
        env:
          ADMIN_TOKEN: ${{ secrets.SBI_WORKER_ADMIN_TOKEN }}
          COLLECTOR_URL: https://kogane-sbi-collector-poc.takuanimal.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          for scope in domestic foreign; do
            response=$(curl --fail-with-body --silent --show-error --max-time 180 \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --request POST \
              --header "Authorization: Bearer ${ADMIN_TOKEN}" \
              "${COLLECTOR_URL}/trigger?scope=${scope}")
            jq -n --arg scope "$scope" --argjson result "$response" '{
              scope: $scope,
              status: $result.status,
              artifactCount: ($result.artifacts | length),
              failureCount: ($result.failures | length),
              manifestKey: $result.manifestKey
            }'
          done
