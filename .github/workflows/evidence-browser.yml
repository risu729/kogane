name: Evidence browser

on:
  pull_request:
    paths:
      - "poc/observation-pipeline/**"
      - "docs/frontend.md"
      - ".github/workflows/evidence-browser.yml"
  push:
    branches: [main]
    paths:
      - "poc/observation-pipeline/**"
      - "docs/frontend.md"
      - ".github/workflows/evidence-browser.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: poc/observation-pipeline
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
        env:
          CI: "true"
