# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of services/collector-sbi-vc-trade."
run = "./node_modules/.bin/wrangler types worker-configuration.d.ts --env-file .dev.vars.example --strict-vars false"

[tasks."typecheck"]
description = "Type-check services/collector-sbi-vc-trade."
depends = ["//services/collector-sbi-vc-trade:types"]
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the services/collector-sbi-vc-trade tests."
depends = ["//services/collector-sbi-vc-trade:types"]
run = [
	"bun test ./test/*.test.ts",
	"./node_modules/.bin/vitest run",
]

[tasks."dry-run"]
description = "Validate the services/collector-sbi-vc-trade deployment without uploading it."
depends = ["//services/collector-sbi-vc-trade:cf-build", "//services/collector-sbi-vc-trade:types"]
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

[tasks."bundle"]
description = "Emit the deployable bundle of services/collector-sbi-vc-trade for the release manifest."
depends = ["//services/collector-sbi-vc-trade:cf-build", "//services/collector-sbi-vc-trade:types"]
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/sbi-vc-trade-worker --config wrangler.jsonc"

[tasks."ci"]
description = "Every check CI runs for services/collector-sbi-vc-trade."
depends = ["//services/collector-sbi-vc-trade:cf-typecheck", "//services/collector-sbi-vc-trade:typecheck", "//services/collector-sbi-vc-trade:test"]

[tasks."cf-build"]
description = "Build and validate the prebuilt cf production artifact without credentials."
depends = ["//services/collector-sbi-vc-trade:types"]
run = [
	"./node_modules/.bin/cf build --mode production",
	"./node_modules/.bin/cf workers versions create --prebuilt --mode production --worker kogane-sbi-vc-session-poc --dry-run",
	"node ../../tasks/_lib/ci/cf-do-identity.mjs validate sbi-vc-trade-worker",
]

[tasks."cf-typecheck"]
description = "Type-check the native cf build and production configurations."
depends = ["//services/collector-sbi-vc-trade:types"]
run = "./node_modules/.bin/tsc --noEmit --project tsconfig.cloudflare.json"
