# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["moneyforward-worker:types"]
description = "Generate the Cloudflare Worker types of services/collector-moneyforward."
dir = "services/collector-moneyforward"
run = "./node_modules/.bin/wrangler types"

["moneyforward-worker:typecheck"]
description = "Type-check services/collector-moneyforward."
depends = ["moneyforward-worker:types"]
dir = "services/collector-moneyforward"
run = "./node_modules/.bin/tsc --noEmit"

["moneyforward-worker:test"]
description = "Run the services/collector-moneyforward tests."
depends = ["moneyforward-worker:types"]
dir = "services/collector-moneyforward"
run = "bun test"

["moneyforward-worker:dry-run"]
description = "Validate the services/collector-moneyforward deployment without uploading it."
depends = ["moneyforward-worker:types"]
dir = "services/collector-moneyforward"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

["moneyforward-worker:bundle"]
description = "Emit the deployable bundle of services/collector-moneyforward for the release manifest."
depends = ["moneyforward-worker:types"]
dir = "services/collector-moneyforward"
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/moneyforward-worker --config wrangler.jsonc"

["ci:moneyforward-worker"]
description = "Every check CI runs for services/collector-moneyforward."
depends = ["moneyforward-worker:typecheck", "moneyforward-worker:test"]
