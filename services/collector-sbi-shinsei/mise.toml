# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of services/collector-sbi-shinsei."
run = "./node_modules/.bin/wrangler types"

[tasks."typecheck"]
description = "Type-check services/collector-sbi-shinsei."
depends = ["//services/collector-sbi-shinsei:types"]
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the services/collector-sbi-shinsei tests."
depends = ["//services/collector-sbi-shinsei:types"]
run = [
	"bun test ./test/*.test.ts",
	"./node_modules/.bin/vitest run",
	"bash test/admin-token-sync.test.sh",
	"node --test container/relay-lifecycle.node-test.mjs container/child-lifecycle.node-test.mjs",
]

[tasks."container"]
dir = "container"
description = "Install the container relay's locked npm dependencies and check its syntax."
run = [
	"npm ci --ignore-scripts",
	'for file in *.mjs *.cjs *.js; do if [ -e "$file" ]; then node --check "$file"; fi; done',
]

[tasks."dry-run"]
description = "Validate the services/collector-sbi-shinsei deployment without uploading it."
depends = ["//services/collector-sbi-shinsei:types"]
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

[tasks."bundle"]
description = "Emit the deployable bundle of services/collector-sbi-shinsei for the release manifest."
depends = ["//services/collector-sbi-shinsei:types"]
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/sbi-shinsei-worker --config wrangler.jsonc"

[tasks."ci"]
description = "Every check CI runs for services/collector-sbi-shinsei."
depends = ["//services/collector-sbi-shinsei:typecheck", "//services/collector-sbi-shinsei:test", "//services/collector-sbi-shinsei:container"]
