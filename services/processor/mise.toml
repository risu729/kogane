# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of services/processor."
run = "./node_modules/.bin/wrangler types"

[tasks."typecheck"]
description = "Type-check services/processor."
depends = ["//services/processor:types"]
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run every processor test with two isolated file workers."
depends = ["//services/processor:types"]
# Files use independent Miniflare stores. Keep tests inside each file serial,
# and bound worker count because other workspace checks share the CI runner.
run = "bun test --parallel=2"

[tasks."dry-run"]
description = "Validate the services/processor deployment without uploading it."
depends = ["//services/processor:types"]
run = ["./node_modules/.bin/wrangler deploy --dry-run"]

[tasks."bundle"]
description = "Emit the deployable bundle of services/processor for the release manifest."
depends = ["//services/processor:types"]
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/processor --config wrangler.jsonc"

[tasks."ci"]
description = "Every check CI runs for services/processor."
depends = ["//services/processor:typecheck", "//services/processor:test"]

[tasks."ops"]
description = "Inspect or operate the deployed processor through its authenticated service binding."
run = "node scripts/ops.ts"

[tasks."settlement:shadow"]
description = "Read aggregate card settlement automation prerequisites without adopting anything."
run = "bun scripts/card-settlement-shadow.ts"
