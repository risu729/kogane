# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of services/processor."
run = "./node_modules/.bin/wrangler types"

[tasks."typecheck"]
description = "Type-check services/processor."
depends = ["//services/processor:types"]
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run every processor test sequentially in one process."
depends = ["//services/processor:types"]
# Local full verification retains the complete serial suite. Hosted native
# shards each run serially on a separate runner, with the same preload.
run = "bun test"

[tasks."test-shard-1"]
description = "Run the first native processor file shard serially on its own hosted runner."
depends = ["//services/processor:types"]
run = "bun test --shard=1/2"

[tasks."test-shard-2"]
description = "Run the second native processor file shard serially on its own hosted runner."
depends = ["//services/processor:types"]
run = "bun test --shard=2/2"

[tasks."dry-run"]
description = "Validate the services/processor deployment without uploading it."
depends = ["//services/processor:cf-build", "//services/processor:types"]
run = ["./node_modules/.bin/wrangler deploy --dry-run"]

[tasks."bundle"]
description = "Emit the deployable bundle of services/processor for the release manifest."
depends = ["//services/processor:cf-build", "//services/processor:types"]
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/processor --config wrangler.jsonc"

[tasks."ci"]
description = "Every check CI runs for services/processor."
depends = ["//services/processor:cf-typecheck", "//services/processor:typecheck", "//services/processor:test"]

[tasks."ops"]
description = "Inspect or operate the deployed processor through its authenticated service binding."
run = "node scripts/ops.ts"

[tasks."settlement:shadow"]
description = "Read aggregate card settlement automation prerequisites without adopting anything."
run = "bun scripts/card-settlement-shadow.ts"

[tasks."cf-build"]
description = "Build and validate the prebuilt cf production artifact without credentials."
depends = ["//services/processor:types"]
run = [
	"./node_modules/.bin/cf build --mode production",
	"./node_modules/.bin/cf workers versions create --prebuilt --mode production --worker kogane-observation-pipeline --dry-run",
	"node ../../tasks/_lib/ci/cf-do-identity.mjs validate processor",
]

[tasks."cf-typecheck"]
description = "Type-check the native cf build and production configurations."
depends = ["//services/processor:types"]
run = "./node_modules/.bin/tsc --noEmit --project tsconfig.cloudflare.json"
