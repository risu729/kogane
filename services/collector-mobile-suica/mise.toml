# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of services/collector-mobile-suica."
run = "./node_modules/.bin/wrangler types"

[tasks."typecheck"]
description = "Type-check services/collector-mobile-suica."
depends = ["//services/collector-mobile-suica:types"]
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the services/collector-mobile-suica tests: the pure suite, then the Miniflare R2 suite."
depends = ["//services/collector-mobile-suica:types"]
run = [
	"bun test ./test/*.test.ts",
	"./node_modules/.bin/vitest run",
]

[tasks."dry-run"]
description = "Validate the services/collector-mobile-suica deployment without uploading it."
depends = ["//services/collector-mobile-suica:types"]
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

[tasks."bundle"]
description = "Emit the deployable bundle of services/collector-mobile-suica for the release manifest."
depends = ["//services/collector-mobile-suica:types"]
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/mobile-suica-worker --config wrangler.jsonc"

[tasks."ci"]
description = "Every check CI runs for services/collector-mobile-suica."
depends = ["//services/collector-mobile-suica:typecheck", "//services/collector-mobile-suica:test"]
