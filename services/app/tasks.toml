# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["app:types"]
description = "Generate the Cloudflare Worker types of services/evidence-browser."
dir = "services/evidence-browser"
run = "./node_modules/.bin/wrangler types"

["app:typecheck"]
description = "Type-check services/evidence-browser."
# `src/demo-worker.ts` imports the generated `demo-snapshot.json`, so the
# typecheck needs the export to have run: `ci:app` runs typecheck and test in
# parallel, and without this edge the typecheck could lose that race.
depends = ["app:types", "local-pipeline:export-demo"]
dir = "services/evidence-browser"
run = "./node_modules/.bin/tsc --noEmit"

["app:test"]
description = "Run the services/evidence-browser tests."
depends = [
	"app:types",
	"web:build",
	"web:build-evidence",
	"web:build-production",
	"local-pipeline:export-demo",
]
dir = "services/evidence-browser"
run = "./node_modules/.bin/vitest run"

["app:dry-run"]
description = "Validate the services/evidence-browser deployment without uploading it."
# The production and demo configs serve built assets, so the dry run builds
# them first; in CI the ledger's `prepare` task does the same before the action.
depends = ["app:types", "web:build-production", "local-pipeline:export-demo"]
dir = "services/evidence-browser"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.demo.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.test.jsonc",
]

["app:bundle"]
description = "Emit the deployable bundle of services/evidence-browser for the release manifest."
depends = ["app:types", "web:build-production"]
dir = "services/evidence-browser"
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/app --config wrangler.jsonc"

["app-demo:bundle"]
description = "Emit the deployable bundle of the demo Worker for the release manifest."
depends = ["app:types", "local-pipeline:export-demo"]
dir = "services/evidence-browser"
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/app-demo --config wrangler.demo.jsonc"

["ci:app"]
description = "Every check CI runs for services/evidence-browser."
depends = ["app:typecheck", "app:test"]
