# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of services/app."
run = "./node_modules/.bin/wrangler types"

[tasks."typecheck"]
description = "Type-check services/app."
# `test/snapshot-worker.ts` imports the generated `demo-snapshot.json`, so the
# typecheck needs the export to have run: `ci:app` runs typecheck and test in
# parallel, and without this edge the typecheck could lose that race.
depends = ["//services/app:types", "//experiments/observation-pipeline-local:export-demo"]
run = "./node_modules/.bin/tsc --noEmit"

[tasks."test"]
description = "Run the services/app tests."
depends = [
	"//services/app:types",
	"//apps/web:build",
	"//apps/web:build-evidence",
	"//apps/web:build-production",
	"//experiments/observation-pipeline-local:export-demo",
]
run = "./node_modules/.bin/vitest run"

[tasks."dry-run"]
description = "Validate the services/app deployment without uploading it."
# The production config serves built assets, so the dry run builds them first.
# The synthetic export remains a local test/typecheck fixture.
depends = ["//services/app:types", "//apps/web:build-production", "//experiments/observation-pipeline-local:export-demo"]
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.test.jsonc",
]

[tasks."bundle"]
description = "Emit the deployable bundle of services/app for the release manifest."
depends = ["//services/app:types", "//apps/web:build-production"]
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/app --config wrangler.jsonc"

[tasks."ci"]
description = "Every check CI runs for services/app."
depends = ["//services/app:typecheck", "//services/app:test"]
