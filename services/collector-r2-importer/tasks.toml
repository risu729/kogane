# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["importer:types"]
description = "Generate the Cloudflare Worker types of services/collector-r2-importer."
dir = "services/collector-r2-importer"
run = "./node_modules/.bin/wrangler types"

["importer:typecheck"]
description = "Type-check services/collector-r2-importer."
depends = ["importer:types"]
dir = "services/collector-r2-importer"
run = "./node_modules/.bin/tsc --noEmit"

["importer:test"]
description = "Run the services/collector-r2-importer tests."
depends = ["importer:types"]
dir = "services/collector-r2-importer"
run = [
	"bun test",
	"bun scripts/check-import-adapters.ts",
]

["importer:dry-run"]
description = "Validate the services/collector-r2-importer deployment without uploading it."
depends = ["importer:types"]
dir = "services/collector-r2-importer"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-moneyforward.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-v-point.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-v-point-pay-email.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-sbi-vc.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-myjcb.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-sony-layer-b.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-smbc-direct.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-smbc-direct-layer-b.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-sbi-shinsei.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-global-pass-layer-b.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-v-point-pay-layer-b.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-vpass-layer-b.jsonc",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.audit-moneyforward-layer-b.jsonc",
]

["ci:importer"]
description = "Every check CI runs for services/collector-r2-importer."
depends = ["importer:typecheck", "importer:test"]
