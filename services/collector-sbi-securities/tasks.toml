# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["sbi-securities-worker:types"]
description = "Generate the Cloudflare Worker types of services/collector-sbi-securities."
dir = "services/collector-sbi-securities"
run = "./node_modules/.bin/wrangler types"

["sbi-securities-worker:typecheck"]
description = "Type-check services/collector-sbi-securities."
depends = ["sbi-securities-worker:types"]
dir = "services/collector-sbi-securities"
run = "./node_modules/.bin/tsc --noEmit"

["sbi-securities-worker:test"]
description = "Run the services/collector-sbi-securities tests: the pure suite, then the Miniflare R2 suite."
depends = ["sbi-securities-worker:types"]
dir = "services/collector-sbi-securities"
run = [
	"bun test ./test/*.test.ts",
	"./node_modules/.bin/vitest run",
]

["sbi-securities-worker:dry-run"]
description = "Validate the services/collector-sbi-securities deployment without uploading it."
depends = ["sbi-securities-worker:types"]
dir = "services/collector-sbi-securities"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

["sbi-securities-worker:bundle"]
description = "Emit the deployable bundle of services/collector-sbi-securities for the release manifest."
depends = ["sbi-securities-worker:types"]
dir = "services/collector-sbi-securities"
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/sbi-securities-worker --config wrangler.jsonc"

["ci:sbi-securities-worker"]
description = "Every check CI runs for services/collector-sbi-securities."
depends = ["sbi-securities-worker:typecheck", "sbi-securities-worker:test"]
