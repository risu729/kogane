# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise.json

[tasks."types"]
description = "Generate the Cloudflare Worker types of services/collector-myjcb."
run = "./node_modules/.bin/wrangler types"

[tasks."typecheck"]
description = "Type-check services/collector-myjcb."
depends = ["//services/collector-myjcb:types"]
run = [
	"./node_modules/.bin/tsc --noEmit",
	"./node_modules/.bin/tsc --noEmit -p tsconfig.scripts.json",
]

[tasks."test"]
description = "Run the services/collector-myjcb tests."
depends = ["//services/collector-myjcb:types"]
run = "bun test"

[tasks."dry-run"]
description = "Validate the services/collector-myjcb deployment without uploading it."
depends = ["//services/collector-myjcb:types"]
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

[tasks."bundle"]
description = "Emit the deployable bundle of services/collector-myjcb for the release manifest."
depends = ["//services/collector-myjcb:types"]
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/myjcb-worker --config wrangler.jsonc"

[tasks."ci"]
description = "Every check CI runs for services/collector-myjcb."
depends = ["//services/collector-myjcb:typecheck", "//services/collector-myjcb:test"]
