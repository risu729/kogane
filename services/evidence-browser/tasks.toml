# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["app:types"]
description = "Generate the Cloudflare Worker types of services/evidence-browser."
dir = "services/evidence-browser"
run = "./node_modules/.bin/wrangler types"

["app:typecheck"]
description = "Type-check services/evidence-browser."
depends = ["app:types"]
dir = "services/evidence-browser"
run = "./node_modules/.bin/tsc --noEmit"

["app:test"]
description = "Run the services/evidence-browser tests."
depends = ["app:types", "web:build", "web:build-evidence", "web:build-production", "web:export-demo"]
dir = "services/evidence-browser"
run = "./node_modules/.bin/vitest run"

["app:dry-run"]
description = "Validate the services/evidence-browser deployment without uploading it."
depends = ["app:types"]
dir = "services/evidence-browser"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
	"./node_modules/.bin/wrangler deploy --dry-run --config wrangler.demo.jsonc",
]

["ci:app"]
description = "Every check CI runs for services/evidence-browser."
depends = ["app:typecheck", "app:test"]
