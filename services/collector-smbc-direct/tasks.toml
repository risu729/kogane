# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["smbc-direct-backfill-worker:types"]
description = "Generate the Cloudflare Worker types of services/collector-smbc-direct."
dir = "services/collector-smbc-direct"
run = "./node_modules/.bin/wrangler types worker-configuration.d.ts --env-file .dev.vars.example --strict-vars false"

["smbc-direct-backfill-worker:typecheck"]
description = "Type-check services/collector-smbc-direct."
depends = ["smbc-direct-backfill-worker:types"]
dir = "services/collector-smbc-direct"
run = "./node_modules/.bin/tsc --noEmit"

["smbc-direct-backfill-worker:test"]
description = "Run the services/collector-smbc-direct tests."
depends = ["smbc-direct-backfill-worker:types"]
dir = "services/collector-smbc-direct"
# The Miniflare suite runs first: `bun test ./test` still fails on the three
# pre-existing `cloudflare:workers` mock failures under bun 1.4.0, which this
# work item neither fixes nor hides. The directory argument keeps that failure
# exactly as it was and keeps `worker-test/` (a vitest suite) out of bun's
# discovery.
run = [
	"./node_modules/.bin/vitest run",
	"bun test ./test",
]

["smbc-direct-backfill-worker:dry-run"]
description = "Validate the services/collector-smbc-direct deployment without uploading it."
depends = ["smbc-direct-backfill-worker:types"]
dir = "services/collector-smbc-direct"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

["ci:smbc-direct-backfill-worker"]
description = "Every check CI runs for services/collector-smbc-direct."
depends = ["smbc-direct-backfill-worker:typecheck", "smbc-direct-backfill-worker:test"]
