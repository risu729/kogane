# ref: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json

["globalpass-worker:types"]
description = "Generate the Cloudflare Worker types of services/collector-globalpass."
dir = "services/collector-globalpass"
run = "./node_modules/.bin/wrangler types"

["globalpass-worker:typecheck"]
description = "Type-check services/collector-globalpass."
depends = ["globalpass-worker:types"]
dir = "services/collector-globalpass"
run = "./node_modules/.bin/tsc --noEmit"

["globalpass-worker:test"]
description = "Run the services/collector-globalpass tests."
depends = ["globalpass-worker:types"]
dir = "services/collector-globalpass"
run = [
	"bun test test/diagnostics.test.ts test/worker-collection.test.ts test/model.test.ts test/sanitize.test.ts test/shared-collection.test.ts test/shared-worker.test.ts test/analyze-turnstile-capture.test.mjs test/analyze-turnstile-debugger-capture.test.mjs test/compare-turnstile-probes.test.mjs",
	"./node_modules/.bin/vitest run",
	"node --test test/connect-relay.node.mjs",
]

["globalpass-worker:container"]
description = "Install the container relay's locked npm dependencies and check its syntax."
dir = "services/collector-globalpass/container"
run = [
	"npm ci --ignore-scripts",
	'for file in *.mjs *.cjs *.js; do if [ -e "$file" ]; then node --check "$file"; fi; done',
]

["globalpass-worker:dry-run"]
description = "Validate the services/collector-globalpass deployment without uploading it."
depends = ["globalpass-worker:types"]
dir = "services/collector-globalpass"
run = [
	"./node_modules/.bin/wrangler deploy --dry-run",
]

["globalpass-worker:bundle"]
description = "Emit the deployable bundle of services/collector-globalpass for the release manifest."
depends = ["globalpass-worker:types"]
dir = "services/collector-globalpass"
run = "./node_modules/.bin/wrangler deploy --dry-run --outdir ../../dist/globalpass-worker --config wrangler.jsonc"

["ci:globalpass-worker"]
description = "Every check CI runs for services/collector-globalpass."
depends = ["globalpass-worker:typecheck", "globalpass-worker:test", "globalpass-worker:container"]
